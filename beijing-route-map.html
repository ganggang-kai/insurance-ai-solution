<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京5天路线图 | 2026年8月</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei","PingFang SC",sans-serif; background: #1a1a2e; }
  #map { width: 100vw; height: 100vh; }

  .legend-panel {
    position: fixed; bottom: 20px; left: 12px; right: 12px;
    background: rgba(255,255,255,.95); border-radius: 12px;
    padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    z-index: 1000; max-width: 600px; margin: 0 auto;
  }
  .legend-item {
    display: flex; align-items: center; gap: 4px;
    font-size: .72rem; font-weight: 600; white-space: nowrap;
  }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }

  .day-label {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.75); color: #fff; padding: 6px 16px;
    border-radius: 20px; font-size: .85rem; font-weight: 700;
    z-index: 1000; pointer-events: none;
  }

  @media (max-width: 600px) {
    .legend-panel { bottom: 10px; padding: 8px 10px; gap: 5px; }
    .legend-item { font-size: .65rem; }
    .day-label { font-size: .75rem; top: 10px; }
  }
</style>
</head>
<body>

<div class="day-label">🗺️ 北京5天4夜 · 地点路线图</div>
<div id="map"></div>

<div class="legend-panel">
  <span class="legend-item"><span class="legend-dot" style="background:#4caf50"></span>Day1·抵达</span>
  <span class="legend-item"><span class="legend-dot" style="background:#e53935"></span>Day2·核心</span>
  <span class="legend-item"><span class="legend-dot" style="background:#1e88e5"></span>Day3·地铁</span>
  <span class="legend-item"><span class="legend-dot" style="background:#fb8c00"></span>Day4·转移</span>
  <span class="legend-item"><span class="legend-dot" style="background:#8e24aa"></span>Day5·比赛</span>
  <span class="legend-item"><span class="legend-dot" style="background:#333;width:6px;height:2px;border-radius:2px"></span>路线</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  var map = L.map('map').setView([39.95, 116.38], 11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  var colors = {
    d1: '#4caf50', d2: '#e53935', d3: '#1e88e5', d4: '#fb8c00', d5: '#8e24aa'
  };

  function marker(icon, label, lat, lng, color) {
    return L.circleMarker([lat, lng], {
      radius: 10, color: '#fff', weight: 2.5, fillColor: color, fillOpacity: 0.95
    }).bindTooltip(icon + ' ' + label, { permanent: true, direction: 'top', offset: [0, -6],
      className: 'leaflet-tooltip-custom' });
  }

  // ===== DAY 1: Aug 10 (Mon) - Green =====
  var d1_hotel   = marker('🏨','前门酒店',     39.8965, 116.3975, colors.d1);
  var d1_jingshan= marker('🏔️','景山公园',     39.9225, 116.3964, colors.d1);
  var d1_nanluo  = marker('🏮','南锣鼓巷',     39.9377, 116.4034, colors.d1);

  var route1 = L.polyline([
    [39.8965,116.3975],[39.9225,116.3964],[39.9377,116.4034]
  ], { color: colors.d1, weight: 3, opacity: 0.8, dashArray: '6 4' });

  // ===== DAY 2: Aug 11 (Tue) - Red =====
  var d2_flag   = marker('🇨🇳','天安门升旗',   39.9042, 116.3975, colors.d2);
  var d2_gugong = marker('🏯','故宫博物院',    39.9163, 116.3972, colors.d2);
  var d2_drive  = marker('🚗','出五环去上地',  39.9600, 116.3700, colors.d2);
  var d2_hotel  = marker('🏨','上地酒店',      40.0350, 116.3100, colors.d2);

  var route2 = L.polyline([
    [39.9042,116.3975],[39.9163,116.3972],[39.9600,116.3700],[40.0350,116.3100]
  ], { color: colors.d2, weight: 3, opacity: 0.8, dashArray: '6 4' });

  // ===== DAY 3: Aug 12 (Wed) - Blue (metro) =====
  var d3_yhy   = marker('🏯','颐和园',        39.9999, 116.2755, colors.d3);
  var d3_qh    = marker('🏫','清华大学',      40.0000, 116.3260, colors.d3);
  var d3_bd    = marker('🏫','北京大学',      39.9920, 116.3100, colors.d3);

  var route3 = L.polyline([
    [40.0350,116.3100],[39.9999,116.2755],[40.0000,116.3260],[39.9920,116.3100]
  ], { color: colors.d3, weight: 3, opacity: 0.8, dashArray: '2 0' });

  // ===== DAY 4: Aug 13 (Thu) - Orange =====
  var d4_train  = marker('🚂','铁道博物馆',   39.9830, 116.4980, colors.d4);
  var d4_film   = marker('🎬','电影博物馆',   39.9950, 116.5050, colors.d4);
  var d4_bird   = marker('🏟️','鸟巢水立方',   39.9919, 116.3906, colors.d4);
  var d4_hotel  = marker('🏨','国展酒店',     40.0800, 116.5650, colors.d4);

  var route4 = L.polyline([
    [39.9920,116.3100],[39.9830,116.4980],[39.9950,116.5050],[39.9919,116.3906],[40.0800,116.5650]
  ], { color: colors.d4, weight: 3, opacity: 0.8, dashArray: '6 4' });

  // ===== DAY 5: Aug 14 (Fri) - Purple =====
  var d5_guozhan = marker('🏆','国展新馆',    40.0800, 116.5800, colors.d5);
  var d5_back    = marker('🚗','返程',         40.0500, 116.6300, colors.d5);

  var route5 = L.polyline([
    [40.0800,116.5650],[40.0800,116.5800],[40.0500,116.6300]
  ], { color: colors.d5, weight: 3, opacity: 0.8, dashArray: '2 0' });

  // ===== Layer groups =====
  L.layerGroup([d1_hotel,d1_jingshan,d1_nanluo,route1]).addTo(map);
  L.layerGroup([d2_flag,d2_gugong,d2_drive,d2_hotel,route2]).addTo(map);
  L.layerGroup([d3_yhy,d3_qh,d3_bd,route3]).addTo(map);
  L.layerGroup([d4_train,d4_film,d4_bird,d4_hotel,route4]).addTo(map);
  L.layerGroup([d5_guozhan,d5_back,route5]).addTo(map);

  // ===== Fit bounds to show all markers =====
  var all = [d1_hotel,d1_jingshan,d1_nanluo, d2_flag,d2_gugong,d2_drive,d2_hotel,
             d3_yhy,d3_qh,d3_bd, d4_train,d4_film,d4_bird,d4_hotel, d5_guozhan,d5_back];
  var group = L.featureGroup(all);
  map.fitBounds(group.getBounds().pad(0.1));
</script>
</body>
</html>
